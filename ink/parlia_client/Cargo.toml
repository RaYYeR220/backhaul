[package]
name = "parlia_client"
version = "0.1.0"
edition = "2021"
authors = ["RaYYeR220"]
license = "MIT"
publish = false
description = "Light client of BNB Smart Chain (Parlia) for Portaldot's pallet-contracts, the WASM twin of ParliaClient.sol"

[dependencies]
ink = { version = "5.1.1", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []

# Portaldot charges a deposit per byte of uploaded code, so the contract is built for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
