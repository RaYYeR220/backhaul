[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../results" }]

[fuzz]
runs = 256

[rpc_endpoints]
portaldot = "https://test-evm-rpc-v3.portaldot.dev"
bsc = "https://bsc-testnet-rpc.publicnode.com"

# Portaldot charges a deposit per byte of deployed code (~0.08 tPOT/B), so the contracts that go
# there are built for size: FOUNDRY_PROFILE=portaldot forge build
[profile.portaldot]
optimizer_runs = 1
cbor_metadata = false
bytecode_hash = "none"
out = "out-portaldot"
cache_path = "cache-portaldot"
